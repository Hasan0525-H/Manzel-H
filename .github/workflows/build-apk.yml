name: build-apk

on:
  push:
    branches:
      - "main"
      - "feat/mobile-redesign-v8"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build web
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Package APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Manzel-H.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Manzel-H-APK
          path: Manzel-H.apk
          if-no-files-found: error
          retention-days: 30
