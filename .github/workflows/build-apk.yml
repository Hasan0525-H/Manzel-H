name: build-apk

on:
  push:
    branches:
      - "main"
      - "fix/stable-apk-signing-v9"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build web
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Set Android version
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="9.0.$GITHUB_RUN_NUMBER"
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Create stable signing identity
        run: |
          python - <<'PY'
          import hashlib
          seed = hashlib.sha256(b"Manzel-H-stable-sideload-key-v9").digest()
          der = bytes.fromhex("30310201010420") + seed + bytes.fromhex("a00a06082a8648ce3d030107")
          open("/tmp/manzel-h-ec.der", "wb").write(der)
          PY
          openssl ec -inform DER -in /tmp/manzel-h-ec.der -out /tmp/manzel-h-ec.pem
          openssl pkcs8 -topk8 -nocrypt -in /tmp/manzel-h-ec.pem -outform DER -out /tmp/manzel-h-key.pk8
          openssl req -new -x509 -key /tmp/manzel-h-ec.pem -out /tmp/manzel-h-cert.pem -days 10000 -subj "/C=SA/O=Manzel H/CN=Manzel H"
          openssl x509 -in /tmp/manzel-h-cert.pem -outform DER -out /tmp/manzel-h-cert.der

      - name: Sign APK
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="/tmp/Manzel-H-aligned.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign             --key /tmp/manzel-h-key.pem             --cert /tmp/manzel-h-cert.pem             --out Manzel-H.apk             "$ALIGNED"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs Manzel-H.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Manzel-H-APK
          path: Manzel-H.apk
          if-no-files-found: error
          retention-days: 30
