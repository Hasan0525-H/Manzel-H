name: build-apk

on:
  push:
    branches:
      - "main"
      - "feat/instant-house-v9"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build web
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Set Android version
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="9.0.$GITHUB_RUN_NUMBER"
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Sign APK with stable key
        run: |
          base64 -d android-signing/manzel-h.keystore.b64 > /tmp/manzel-h.keystore
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="/tmp/Manzel-H-aligned.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign             --ks /tmp/manzel-h.keystore             --ks-key-alias manzelh             --ks-pass pass:ManzelH2026             --key-pass pass:ManzelH2026             --out Manzel-H.apk             "$ALIGNED"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose Manzel-H.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Manzel-H-APK
          path: Manzel-H.apk
          if-no-files-found: error
          retention-days: 30
