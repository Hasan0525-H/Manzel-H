name: deploy-cloudflare-jobs
# retrigger after Cloudflare secrets configured

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare-jobs/**"
      - ".github/workflows/deploy-cloudflare-jobs.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: cloudflare-jobs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; skipping deployment."
          fi

      - name: Create queue and buckets
        if: steps.cloudflare.outputs.configured == 'true'
        run: |
          npx wrangler queues create manzel-h-render-jobs || true
          npx wrangler queues create manzel-h-render-dead || true
          npx wrangler r2 bucket create manzel-h-jobs || true

      - name: Deploy Worker
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx wrangler deploy

      - name: Runtime smoke test
        if: steps.cloudflare.outputs.configured == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import struct, zlib
          w = h = 480
          rows = []
          for y in range(h):
              row = bytearray()
              for x in range(w):
                  base = 245 - ((x + y) % 17)
                  if x in range(40, 46) or x in range(210, 218) or x in range(432, 439) or y in range(45, 52) or y in range(220, 227) or y in range(425, 433):
                      r = g = b = 24
                  else:
                      r = g = b = base
                  row.extend((r, g, b))
              rows.append(b"\x00" + bytes(row))
          raw = b"".join(rows)
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(raw, 6))
          png += chunk(b"IEND", b"")
          open("/tmp/manzel-smoke.png", "wb").write(png)
          print("smoke_png_bytes", len(png))
          PY

          CODE="$(curl -sS -o /tmp/render-response.bin -w '%{http_code}'             -X POST 'https://manzel-h-cloud-jobs.kd-alsalhi.workers.dev/render'             -F 'reference=@/tmp/manzel-smoke.png;type=image/png'             -F 'kind=exterior'             -F 'floors=1'             -F 'furnishing=light'             -F 'style=سعودي حديث'             -F 'garden=true'             -F 'parking=true'             -F 'fence=true'             -F 'entrance=formal')"

          echo "runtime_http=$CODE"
          if [ "$CODE" != "200" ]; then
            echo "Runtime render failed:"
            cat /tmp/render-response.bin
            exit 1
          fi

          BYTES="$(wc -c < /tmp/render-response.bin)"
          echo "runtime_image_bytes=$BYTES"
          if [ "$BYTES" -lt 10000 ]; then
            echo "Runtime render returned an unexpectedly small image."
            exit 1
          fi
