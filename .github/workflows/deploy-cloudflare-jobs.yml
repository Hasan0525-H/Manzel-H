name: deploy-cloudflare-jobs

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare-jobs/**"
      - ".github/workflows/deploy-cloudflare-jobs.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
    defaults:
      run:
        working-directory: cloudflare-jobs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Verify provider migration
        shell: bash
        run: |
          if grep -R "@cf/\|env\.AI\|MODAL_PIPELINE_URL\|callModal" src wrangler.jsonc; then
            echo "Legacy cloud render dependency detected."
            exit 1
          fi
          grep -q "Qwen/Qwen-Image-Edit-2511" src/index.ts

      - name: Verify credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$MODELSCOPE_TOKEN" || (echo "Missing MODELSCOPE_TOKEN" && exit 1)

      - name: Ensure queues and R2 exist
        run: |
          npx wrangler queues create manzel-h-render-jobs || true
          npx wrangler queues create manzel-h-render-dead || true
          npx wrangler r2 bucket create manzel-h-jobs || true

      - name: Publish ModelScope token
        shell: bash
        run: printf '%s' "$MODELSCOPE_TOKEN" | npx wrangler secret put MODELSCOPE_TOKEN

      - name: Deploy gateway
        run: npx wrangler deploy

      - name: Gateway health
        shell: bash
        run: |
          STATUS="$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            'https://manzel-h-cloud-jobs.kd-alsalhi.workers.dev/health')"
          cat /tmp/health.json
          test "$STATUS" = "200"
          grep -q '"provider":"modelscope-api-inference"' /tmp/health.json
          grep -q '"configured":true' /tmp/health.json
