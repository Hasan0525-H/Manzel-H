name: deploy-cloudflare-jobs

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare-jobs/**"
      - ".github/workflows/deploy-cloudflare-jobs.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MODAL_PIPELINE_URL: ${{ vars.MODAL_PIPELINE_URL }}
    defaults:
      run:
        working-directory: cloudflare-jobs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Assert Workers AI was removed
        shell: bash
        run: |
          if grep -R "@cf/\|env\.AI\|Workers AI" src wrangler.jsonc; then
            echo "Legacy Workers AI reference detected."
            exit 1
          fi

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; skipping deployment."
          fi

      - name: Create queue and bucket
        if: steps.cloudflare.outputs.configured == 'true'
        run: |
          npx wrangler queues create manzel-h-render-jobs || true
          npx wrangler queues create manzel-h-render-dead || true
          npx wrangler r2 bucket create manzel-h-jobs || true

      - name: Deploy gateway
        if: steps.cloudflare.outputs.configured == 'true'
        shell: bash
        run: |
          if [ -n "$MODAL_PIPELINE_URL" ]; then
            npx wrangler deploy --var "MODAL_PIPELINE_URL:$MODAL_PIPELINE_URL"
          else
            npx wrangler deploy
          fi

      - name: Gateway health
        if: steps.cloudflare.outputs.configured == 'true' && env.MODAL_PIPELINE_URL != ''
        shell: bash
        run: |
          STATUS="$(curl -sS -o /tmp/health.json -w '%{http_code}'             'https://manzel-h-cloud-jobs.kd-alsalhi.workers.dev/health')"
          cat /tmp/health.json
          test "$STATUS" = "200"
